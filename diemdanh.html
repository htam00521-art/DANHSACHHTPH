<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Điểm Danh QR Code - Đoàn TNTT Phước Hảo</title>
    
    <link rel="icon" type="image/jpeg" href="logo_app.jpg">
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Auth (Dành cho Đăng nhập) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
    
    <!-- Thư viện Quét mã QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        /* ================= STYLE CHUNG CỦA WEB ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', 'Inter', sans-serif; }
        
        body { 
            background: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), url('bg_church.jpg'); 
            background-position: center center; background-size: cover; background-attachment: fixed; 
            min-height: 100vh; padding: 16px; color: #1e293b; 
        }
        
        .container-web { max-width: 1200px; margin: 0 auto; }

        /* THANH ĐIỀU HƯỚNG */
        .cls-topbar { background: linear-gradient(135deg, #0d47a1, #1565c0 50%, #42a5f5); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #fff; padding: 0.7rem 1.2rem; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 114, 255, 0.25); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; position: sticky; top: 0; z-index: 100; }
        .cls-brand { display: flex; align-items: center; gap: 0.75rem; color: #fff; text-decoration: none; font-weight: 800; font-size: 1.05rem; text-transform: uppercase; }
        .cls-brand img { width: 44px; height: 44px; border-radius: 50%; background: #fff; padding: 2px; }
        .cls-nav-link { color: rgba(255,255,255,0.95); text-decoration: none; font-weight: 700; font-size: 0.88rem; padding: 0.5rem 1rem; border-radius: 999px; transition: 0.3s; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); }
        .cls-nav-link:hover, .cls-nav-link.active { background: rgba(255,255,255,0.32); color: #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.15); transform: translateY(-2px); }

        /* AUTH BAR */
        .auth-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); flex-wrap: wrap; gap: 10px; }
        .user-status { font-size: 14px; color: #333; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .user-avatar-mini { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #0D47A1; }
        .role-tag { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; color: #fff; background: #d32f2f; }
        .btn-auth-action { background: #546e7a; color: #fff; border: none; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s;}
        .btn-auth-action:hover { background: #37474f; }

        /* VÙNG CẤM KHÁCH */
        #accessDeniedArea { display: none; height: 60vh; text-align: center; flex-direction: column; align-items: center; justify-content: center; }

        /* ================= STYLE CỦA APP ĐIỂM DANH QR ================= */
        :root {
            --qr-primary: #4f46e5; --qr-primary-light: #e0e7ff;
            --qr-success: #10b981; --qr-success-light: #d1fae5;
            --qr-error: #ef4444; --qr-error-light: #fee2e2;
            --qr-card-bg: #ffffff;
            --qr-text-main: #111827; --qr-text-muted: #6b7280; --qr-border: #e5e7eb;
        }

        #qrAppArea { display: none; flex-direction: column; max-width: 550px; margin: 0 auto; gap: 16px; height: 80vh; }
        
        .qr-card { background: var(--qr-card-bg); padding: 16px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.8); display: flex; flex-direction: column; }
        #card-camera { flex-shrink: 0; }
        #card-list { flex: 1; min-height: 250px; overflow: hidden; margin-bottom: 20px;}

        .header-title { text-align: center; font-size: 20px; font-weight: 800; color: #0D47A1; margin-bottom: 12px; letter-spacing: -0.5px; }
        
        .activity-selector { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        .activity-selector select { width: 100%; padding: 10px 14px; border-radius: 12px; border: 2px solid #0ea5e9; background-color: var(--qr-card-bg); font-size: 15px; font-weight: 700; color: #0D47A1; outline: none; cursor: pointer; transition: 0.2s;}
        
        .today-badge { display: flex; align-items: center; justify-content: center; background-color: var(--qr-primary-light); color: var(--qr-primary); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 14px; width: 100%; margin-bottom: 12px; }
        
        .scanner-container { display: flex; justify-content: center; align-items: center; margin-bottom: 12px; position: relative; }
        #reader { width: 220px; height: 220px; border-radius: 20px; overflow: hidden; border: 4px solid var(--qr-primary-light); box-shadow: 0 8px 24px rgba(79, 70, 229, 0.15); background: #000; position: relative; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; border-radius: 16px !important; }
        #btn-fallback { position: absolute; z-index: 10; background: var(--qr-primary); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; display: none; }
        #reader__dashboard_section_csr span, #reader__dashboard_section_swaplink { color: var(--qr-primary) !important; font-weight: bold; text-decoration: none; }
        #reader__dashboard_section_csr button { background: var(--qr-primary) !important; color: white !important; border: none !important; padding: 6px 12px !important; border-radius: 10px !important; font-weight: bold !important; cursor: pointer; }

        #status { padding: 10px; text-align: center; font-weight: 700; font-size: 14px; border-radius: 10px; transition: all 0.3s ease; margin-bottom: 4px; }
        .status-default { background: var(--qr-border); color: var(--qr-text-muted); }
        .status-success { background: var(--qr-success-light); color: var(--qr-success); }
        .status-error { background: var(--qr-error-light); color: var(--qr-error); }
        .status-loading { background: var(--qr-primary-light); color: var(--qr-primary); }

        .list-header-wrapper { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .list-header { font-size: 18px; font-weight: 800; margin: 0; color: #1e293b;}
        .btn-toggle { background-color: var(--qr-primary-light); color: var(--qr-primary); border: none; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s ease; }
        
        .user-list { flex: 1; overflow-y: auto; padding-right: 4px; position: relative; }
        .user-list::-webkit-scrollbar { width: 6px; }
        .user-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .user-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; margin-bottom: 10px; border-radius: 14px; border: 1px solid var(--qr-border); background: #f8fafc; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .user-item.active { background-color: #f0fdf4; border-color: var(--qr-success); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1); }

        .user-info-wrapper { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background-color: var(--qr-primary-light); color: var(--qr-primary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
        .user-item.active .avatar { background-color: var(--qr-success-light); color: var(--qr-success); }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 15px; font-weight: 700; color: var(--qr-text-main); margin-bottom: 2px;}
        .user-id { font-size: 12px; font-weight: 600; color: var(--qr-text-muted); }

        .custom-checkbox-container { position: relative; cursor: pointer; font-size: 22px; user-select: none; width: 28px; height: 28px; }
        .custom-checkbox-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 28px; width: 28px; background-color: #fff; border: 2px solid #cbd5e1; border-radius: 50%; transition: all 0.2s ease; }
        .custom-checkbox-container input:checked ~ .checkmark { background-color: var(--qr-success); border-color: var(--qr-success); }
        .checkmark:after { content: ""; position: absolute; display: none; left: 9px; top: 5px; width: 6px; height: 12px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .custom-checkbox-container input:checked ~ .checkmark:after { display: block; }

        @media (max-width: 991px) {
            .cls-topbar { margin: 16px; border-radius: 24px !important; padding: 20px 16px; position: relative; }
            .cls-brand { justify-content: center; width: 100%; margin-bottom: 15px; }
            .cls-nav-menu { flex-direction: column; width: 100%; gap: 8px !important; }
            .cls-nav-link { width: 100%; display: flex; justify-content: center; align-items: center; padding: 12px 20px !important; }
            .auth-bar { flex-direction: column; text-align: center; }
            #qrAppArea { height: auto; min-height: 85vh; }
        }
    </style>
</head>
<body>

    <header class="cls-topbar">
        <div class="container-web d-flex justify-content-between align-items-center flex-wrap" style="padding: 0; max-width: 100%;">
            <a class="cls-brand" href="index.html">
                <img src="logo_app.jpg" onerror="this.onerror=null; this.src='logo.png';" alt="Logo">
                <span>TNTT PHƯỚC HẢO</span>
            </a>
            <nav id="navMenuLinks" class="cls-nav-menu d-flex gap-2 flex-wrap">
                <a href="index.html" class="cls-nav-link"><i class="fas fa-home me-1"></i> Trang chủ</a>
                <a href="tintuc.html" class="cls-nav-link"><i class="fa-solid fa-newspaper me-1"></i> Tin Tức</a>
                <a href="classes.html" class="cls-nav-link"><i class="fas fa-users-gear me-1"></i> Lịch Trực</a>
                <a href="diemdanh.html" class="cls-nav-link active"><i class="fas fa-clipboard-user me-1"></i> Điểm Danh Đội</a>
                <a href="chiadoi.html" class="cls-nav-link"><i class="fa-solid fa-shuffle me-1"></i> Chia Đội</a>
            </nav>
        </div>
    </header>

    <div class="container-web">
        
        <!-- AUTH BAR -->
        <div class="auth-bar">
            <div class="user-status d-flex align-items-center gap-2">
                <img id="userAvatarMini" class="user-avatar-mini" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
                <div class="d-flex align-items-center gap-2">
                    <span id="userNameDisplay" style="font-weight: 600;">Khách</span>
                    <span id="roleBadge" class="role-tag" style="background:#64748b;">Người xem</span>
                </div>
            </div>
            <div class="auth-actions d-flex gap-2">
                <div id="googleBtnContainer"></div>
                <button id="logoutBtn" class="btn-auth-action btn-logout" style="display:none;" onclick="xuLyDangXuat()">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </div>

        <!-- MÀN HÌNH CHẶN KHÁCH -->
        <div id="accessDeniedArea">
            <i class="fa-solid fa-shield-halved" style="font-size: 80px; color: #ef4444; margin-bottom: 20px; filter: drop-shadow(0 4px 10px rgba(239, 68, 68, 0.3));"></i>
            <h2 style="font-weight: 800; color: #1e293b; font-size: 28px;">BẢO MẬT HỆ THỐNG</h2>
            <p style="color: #64748b; max-width: 400px;">Chức năng này chỉ dành cho Huynh Trưởng. Vui lòng đăng nhập bằng tài khoản được cấp quyền để điểm danh.</p>
        </div>

        <!-- KHU VỰC APP ĐIỂM DANH QR -->
        <div id="qrAppArea">
            <div class="qr-card" id="card-camera">
                <h2 class="header-title"><i class="fa-solid fa-qrcode text-primary me-2"></i>Hệ Thống Điểm Danh</h2>
                
                <div class="activity-selector">
                    <select id="sheetSelect" onchange="onSheetChange()">
                        <option>Đang tải danh mục...</option>
                    </select>
                </div>

                <div class="today-badge"><i class="fa-solid fa-calendar-day me-2"></i> Hôm nay: &nbsp;<span id="todayDisplay">...</span></div>
                
                <div class="scanner-container">
                    <div id="reader"></div>
                    <button id="btn-fallback" onclick="startCamera()"><i class="fa-solid fa-camera me-1"></i> Chạm để bật Camera</button>
                </div>

                <div id="status" class="status-default"><i class="fa-solid fa-spinner fa-spin me-2"></i> Đang kết nối hệ thống...</div>
            </div>

            <div class="qr-card" id="card-list">
                <div class="list-header-wrapper">
                    <h3 class="list-header"><i class="fa-solid fa-list-check me-2"></i>Danh Sách Trạng Thái</h3>
                    <button id="btnToggleList" class="btn-toggle" onclick="toggleList()"><i class="fa-solid fa-compress me-1"></i> Thu gọn</button>
                </div>
                <div class="user-list" id="userList"></div>
            </div>
        </div>

    </div>

    <script>
        // ================= ĐỊA CHỈ API CỦA GOOGLE SHEETS =================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOeEA324N8VhO2kYghTIIf_FXNiMccquYa0nDiZOwFcHj9bcBhkcZcoXzS-35z4BWy/exec";
        
        // ================= THIẾT LẬP AUTHENTICATION & PHÂN QUYỀN =================
        const ADMIN_EMAILS = ["htam00521@gmail.com", "yinsnhuw29@gmail.com"]; 
        const GOOGLE_CLIENT_ID = "262126423881-einke9pok3r8at0d9hrnli04klf68s9q.apps.googleusercontent.com";
        let currentUser = JSON.parse(localStorage.getItem("ht_user_session")) || { name: "Khách", email: "", role: "viewer" };
        
        window.onload = function() {
            xacDinhQuyenTruyCap();
            if (window.google) {
                google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
                google.accounts.id.renderButton(document.getElementById("googleBtnContainer"), { theme: "outline", size: "medium", shape: "pill" });
            }
        };

        function handleCredentialResponse(response) {
            try {
                const payload = jwt_decode(response.credential);
                const email = payload.email.toLowerCase().trim();
                let role = "viewer";
                if (ADMIN_EMAILS.includes(email)) role = "admin";
                currentUser = { name: payload.name, email: email, picture: payload.picture, role: role };
                localStorage.setItem("ht_user_session", JSON.stringify(currentUser));
                xacDinhQuyenTruyCap();
            } catch (e) { console.error(e); }
        }

        function xuLyDangXuat() {
            localStorage.removeItem("ht_user_session");
            currentUser = { name: "Khách", email: "", role: "viewer" };
            xacDinhQuyenTruyCap();
            if(html5QrCode) { 
                try { html5QrCode.stop(); } catch(e){} 
            }
        }

        function xacDinhQuyenTruyCap() {
            document.getElementById("userNameDisplay").innerText = currentUser.name || "Khách";
            document.getElementById("userAvatarMini").src = currentUser.picture || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
            
            const badge = document.getElementById("roleBadge");
            if (currentUser.role === "admin") {
                badge.innerText = "Trưởng Trực"; badge.style.background = "#059669";
                
                // HIỂN THỊ KHU VỰC APP QR
                document.getElementById("qrAppArea").style.display = "flex";
                document.getElementById("accessDeniedArea").style.display = "none";
                
                // KÍCH HOẠT DỮ LIỆU TỪ GOOGLE SHEETS NẾU CHƯA LOAD
                if(!isDataLoaded) loadInitialData(); 
            } else {
                badge.innerText = "Người xem"; badge.style.background = "#64748b";
                document.getElementById("qrAppArea").style.display = "none";
                document.getElementById("accessDeniedArea").style.display = "flex";
            }

            document.getElementById("googleBtnContainer").style.display = currentUser.email ? "none" : "block";
            document.getElementById("logoutBtn").style.display = currentUser.email ? "inline-flex" : "none";
        }


        // ================= LOGIC LÕI QUÉT QR =================
        let globalData = {}; 
        let currentSheetName = ""; 
        let usersData = []; 
        let todayDateStr = "";
        let isProcessing = false; 
        let isExpanded = true; 
        let lastScannedId = null; 
        let isDataLoaded = false;
        
        const html5QrCode = new Html5Qrcode("reader");

        function getInitials(name) { return name && name.trim() !== "" ? name.trim().split(" ").pop().charAt(0).toUpperCase() : "?"; }
        
        function updateStatus(message, type) {
            const statusEl = document.getElementById("status");
            statusEl.innerHTML = type === 'loading' ? `<i class="fa-solid fa-spinner fa-spin me-2"></i> ${message}` : message;
            statusEl.className = ""; 
            if(type === 'success') statusEl.classList.add('status-success');
            else if(type === 'error') statusEl.classList.add('status-error');
            else if(type === 'loading') statusEl.classList.add('status-loading');
            else statusEl.classList.add('status-default');
        }

        function toggleList() {
            isExpanded = !isExpanded;
            document.getElementById("btnToggleList").innerHTML = isExpanded ? '<i class="fa-solid fa-compress me-1"></i> Thu gọn' : '<i class="fa-solid fa-expand me-1"></i> Mở rộng';
            renderList();
        }

        function onSheetChange() {
            const select = document.getElementById("sheetSelect");
            currentSheetName = select.value;
            usersData = globalData[currentSheetName] || [];
            lastScannedId = null; 
            renderList();
            updateStatus(`Đã chuyển sang danh sách: ${currentSheetName}`, "default");
        }

        function loadInitialData() {
            fetch(SCRIPT_URL).then(res => res.json()).then(data => {
                isDataLoaded = true;
                todayDateStr = data.today;
                globalData = data.data; 
                
                document.getElementById("todayDisplay").innerText = todayDateStr; 
                
                const select = document.getElementById("sheetSelect");
                select.innerHTML = "";
                data.sheetNames.forEach(sheet => {
                    const opt = document.createElement("option");
                    opt.value = sheet; opt.innerText = sheet;
                    select.appendChild(opt);
                });

                if (data.sheetNames.length > 0) {
                    currentSheetName = data.sheetNames[0];
                    usersData = globalData[currentSheetName] || [];
                }

                renderList();
                startCamera();
            }).catch(err => { updateStatus("⚠️ Lỗi kết nối máy chủ Google Sheets!", "error"); });
        }

        function renderList() {
            const container = document.getElementById("userList");
            container.innerHTML = "";
            let displayUsers = usersData;
            
            // Lọc bỏ những dòng trống (không có Mã ID)
            displayUsers = displayUsers.filter(u => u.id !== "");

            if (!isExpanded) {
                if (lastScannedId) displayUsers = displayUsers.filter(u => u.id === lastScannedId);
                else displayUsers = [];
            }
            
            if (displayUsers.length === 0) {
                if (!isExpanded) container.innerHTML = `<div style="text-align:center; padding: 25px 10px; color: var(--qr-text-muted); font-size: 13px; line-height: 1.6;">✨ Chế độ thu gọn.<br>Người vừa quét sẽ hiển thị tại đây!</div>`;
                else container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--qr-text-muted); font-size: 13px;">Danh sách trống</div>`;
                return;
            }

            displayUsers.forEach(user => {
                const div = document.createElement("div");
                div.className = `user-item ${user.checked ? 'active' : ''}`;
                div.id = `user-${user.id}`;
                div.innerHTML = `
                    <div class="user-info-wrapper">
                        <div class="avatar">${getInitials(user.name)}</div>
                        <div class="user-info"><span class="user-name">${user.name}</span><span class="user-id">Mã: ${user.id}</span></div>
                    </div>
                    <label class="custom-checkbox-container">
                        <input type="checkbox" ${user.checked ? 'checked' : ''} onchange="manualCheck('${user.id}', this.checked)">
                        <span class="checkmark"></span>
                    </label>`;
                container.appendChild(div);
            });
        }

        function startCamera() {
            document.getElementById("btn-fallback").style.display = "none";
            updateStatus("Đang bật camera...", "loading");

            const config = { fps: 10, qrbox: { width: 180, height: 180 } };

            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length > 0) {
                    let cameraId = devices[0].id; 
                    for (let i = 0; i < devices.length; i++) {
                        let camName = devices[i].label.toLowerCase();
                        if (camName.includes("back") || camName.includes("sau") || camName.includes("environment")) { cameraId = devices[i].id; break; }
                    }
                    html5QrCode.start(cameraId, config, onScanSuccess)
                    .then(() => updateStatus("📷 Sẵn sàng điểm danh!", "success"))
                    .catch(err => { console.log(err); showFallback(); });
                } else updateStatus("⚠️ Không tìm thấy thiết bị camera!", "error");
            }).catch(err => {
                html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
                .catch(err2 => showFallback());
            });
        }

        function showFallback() {
            document.getElementById("btn-fallback").style.display = "block";
            updateStatus("⚠️ Camera bị lỗi chặn. Chạm nút phía trên để thử lại.", "error");
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return; 

            let user = usersData.find(u => u.id === decodedText);
            if (user) {
                if (user.checked) { updateStatus(`Mã [${decodedText}] đã điểm danh rồi!`, "loading"); return; }
                
                isProcessing = true;
                user.checked = true;
                lastScannedId = decodedText; 
                renderList(); 
                
                if (isExpanded) {
                    const targetRow = document.getElementById(`user-${user.id}`);
                    if (targetRow) document.getElementById("userList").scrollTo({ top: targetRow.offsetTop - 50, behavior: 'smooth' });
                }

                // Phát tiếng bíp
                let audio = new Audio('https://www.soundjay.com/buttons/sounds/beep-07a.mp3');
                audio.play();

                sendDataToSheet(decodedText, true);
                setTimeout(() => { isProcessing = false; }, 1500); 
            } else { 
                updateStatus(`❌ Mã [${decodedText}] không có trong danh sách [${currentSheetName}]`, "error"); 
            }
        }

        function sendDataToSheet(qrCode, isChecked) {
            updateStatus(`Đang ghi nhận: ${qrCode}...`, "loading");
            fetch(SCRIPT_URL, { 
                method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify({ qrCode: qrCode, checked: isChecked, sheetName: currentSheetName }) 
            }).then(() => updateStatus(`✅ Điểm danh thành công mã: ${qrCode}`, "success"));
        }

        function manualCheck(qrCode, isChecked) {
            let user = usersData.find(u => u.id === qrCode);
            if (user) {
                user.checked = isChecked;
                lastScannedId = qrCode; 
                renderList();
            }
            sendDataToSheet(qrCode, isChecked);
        }

    </script>
</body>
</html>
